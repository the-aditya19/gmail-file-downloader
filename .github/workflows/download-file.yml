https://example.com/report.xlsx
Flow:




Plain Text
Gmail
↓
Apps Script finds URL
↓
Triggers GitHub Action
↓
GitHub downloads report.xlsx
↓
Commits to repository
↓
Email marked read
The file goes directly from the internet to GitHub's cloud runner. It never touches your laptop.

Even Better
If the email contains attachments instead of links, Apps Script can read the attachment and send it directly to GitHub as Base64 content. That's usually more reliable than downloading from links.

