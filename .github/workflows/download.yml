name: Download File

on:
  repository_dispatch:
    types: [email_file]

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create folder
        run: mkdir -p downloaded_files

      - name: Download ZIP
        run: |
          curl -L "${{ github.event.client_payload.url }}" \
          -o downloaded_files/AI-Motion-Toolkit.zip

      - name: Show files
        run: ls -lah downloaded_files

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add downloaded_files/

          git diff --cached --quiet || \
          git commit -m "Add downloaded file"

          git push
